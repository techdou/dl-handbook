<!DOCTYPE html>
<html lang="zh-CN">
<!-- 文档类型声明：HTML5 标准，中文语言 -->
<head>
  <!-- 页面头部信息 -->
  <meta charset="UTF-8" />
  <!-- 字符编码：支持中文和特殊字符 -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- 网站图标：SVG 格式 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 视口设置：适配移动端，初始缩放比例 1:1 -->
  <title>深度学习入门 Handbook</title>
  <!-- 页面标题：浏览器标签页显示 -->

  <!-- Google Fonts 预连接：加速字体加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- 预连接字体 API 服务器 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 预连接字体静态资源服务器，crossorigin 允许跨域 -->

  <!-- 加载字体：衬线体（正文/标题）+ 等宽体（代码/公式） -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Noto Serif SC：中文衬线体（教科书感）
       JetBrains Mono：等宽字体（代码/数字）
       Source Serif 4：英文衬线体（学术风格） -->

  <!-- KaTeX 数学公式渲染库的 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <!-- 页面主体 -->
  <div id="app"></div>
  <!-- Vue 应用挂载点：所有 Vue 组件渲染到此处 -->
  <script type="module" src="/src/main.js"></script>
  <!-- 引入 Vue 应用入口文件，使用 ES Module 模式 -->
</body>
</html>
