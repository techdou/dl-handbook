  <!-- 靛青色 DL 文字 -->
  <text x="16" y="22" text-anchor="middle" font-size="14" font-weight="700" font-family="Georgia, serif" fill="#2c5282">DL</text>
  <!-- 底部装饰线 -->
  <line x1="8" y1="25" x2="24" y2="25" stroke="#2c5282" stroke-width="1" opacity="0.4"/>
</svg>
